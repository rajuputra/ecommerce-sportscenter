name: sportscenter

services:
  db:
    image: mysql:8.4.10
    command: ["--innodb-buffer-pool-size=96M", "--max-connections=24", "--performance-schema=OFF"]
    environment:
      MYSQL_DATABASE: sports-center
      MYSQL_USER: sportscenter
      MYSQL_PASSWORD: ${SPORTSCENTER_DB_PASSWORD:?Set SPORTSCENTER_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 4s
      retries: 24
    mem_limit: 440m
    restart: unless-stopped

  api:
    image: eclipse-temurin:25.0.2_10-jre-alpine
    user: "10001:10001"
    command: ["java", "-Xmx256m", "-XX:ActiveProcessorCount=2", "-jar", "/app/sportscenter.jar"]
    environment:
      SPORTSCENTER_DB_URL: jdbc:mysql://db:3306/sports-center
      SPORTSCENTER_DB_PASSWORD: ${SPORTSCENTER_DB_PASSWORD:?Set SPORTSCENTER_DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 6
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET}
      APP_REQUIRE_PERSISTENT_SECRET: "true"
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
    volumes:
      - ./sportscenter.jar:/app/sportscenter.jar:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        aliases: [avero-api-internal]
    mem_limit: 460m
    restart: unless-stopped

  web:
    image: caddy:2.11.8-alpine
    ports:
      - "127.0.0.1:${SPORTSCENTER_PREVIEW_PORT:-15481}:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8080/api/products?size=1'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    mem_limit: 80m
    restart: unless-stopped

volumes:
  db:
