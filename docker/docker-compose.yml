name: sportscenter-local

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: sports-center
      MYSQL_USER: sportscenter
      MYSQL_PASSWORD: ${SPORTSCENTER_DB_PASSWORD:?Set SPORTSCENTER_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "127.0.0.1:${SPORTSCENTER_DB_PORT:-13376}:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db:
