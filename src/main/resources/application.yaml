server:
  port: ${PORT:8081}

spring:
  application:
    name: SportsCenter
  datasource:
    url: ${SPORTSCENTER_DB_URL:jdbc:mysql://127.0.0.1:13376/sports-center}
    username: ${SPORTSCENTER_DB_USER:sportscenter}
    password: ${SPORTSCENTER_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  mvc:
    problemdetails:
      enabled: true
